# Add this map to nginx's http block, outside the server block.
map $http_upgrade $cloudcli_hub_connection {
    default upgrade;
    '' close;
}

# Put the locations below in the existing ai.hwaipy.cn HTTPS server block.
# Hub listens on 127.0.0.1:3003 on this same host. The old direct-to-backend
# CloudCLI locations must be replaced, not left alongside these rules.

location = /cloudcli {
    return 308 /cloudcli/;
}

location = /hub {
    return 308 /hub/;
}

location ~ ^/(cloudcli/|hub/|api/|health$|ws$|shell$|plugin-ws/|desktop-notifications$) {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $cloudcli_hub_connection;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 200m;
}

# Older CloudCLI links and a few root-relative icons still need these aliases.
location ~ ^/(session/|api-docs\.html$|logo(?:-[^/]+)?\.svg$|logo-[^/]+\.png$|favicon\.[^/]+$|icons/) {
    proxy_pass http://127.0.0.1:3003;
    proxy_set_header Host $host;
}
